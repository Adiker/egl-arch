---
name: Release

# Черновик релиза для каждой новой пары «версия Epic + ревизия упаковки».
# Публикует черновик владелец; после этого egl-update ставит его всем.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packaging/RELEASE

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  LC_ALL: C.UTF-8

jobs:
  plan:
    name: Check Epic version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Черновики видны только токену с правом записи.
    permissions:
      contents: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      epic-full-version: ${{ steps.plan.outputs.epic-full-version }}
      rpm-evr: ${{ steps.plan.outputs.rpm-evr }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          full=$(curl --fail --silent --show-error --proto '=https' \
            --retry 3 --connect-timeout 15 --max-time 60 \
            https://content-download-egs.distro.on.epicgames.com/Builds/EGLv2/stable-target.json |
            jq -er '.version')
          if [[ ! $full =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+g([0-9a-f]{7,40})$ ]]; then
            echo "unexpected Epic version: $full" >&2
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          gitrev=${BASH_REMATCH[2]}
          pkgrel=$(tr -d '\r\n' < packaging/RELEASE)
          [[ $pkgrel =~ ^[1-9][0-9]*$ ]]
          evr="$version-$pkgrel.git$gitrev"
          tag="v$evr"

          build=true
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists (draft or published); nothing to do"
            build=false
          fi
          {
            printf 'build=%s\n' "$build"
            printf 'tag=%s\n' "$tag"
            printf 'epic-full-version=%s\n' "$full"
            printf 'rpm-evr=%s\n' "$evr"
          } >> "$GITHUB_OUTPUT"

  build-package:
    name: Build RPM
    needs: plan
    if: needs.plan.outputs.build == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml

  draft-release:
    name: Attest RPM and create draft
    needs:
      - plan
      - build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download RPM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: egl-fedora-rpm-${{ github.run_id }}
          path: release-assets

      - name: Verify asset and create checksums
        env:
          RPM_EVR: ${{ needs.plan.outputs.rpm-evr }}
          FEDORA_VERSION: ${{ needs.build-package.outputs.fedora-version }}
        shell: bash
        run: |
          set -euo pipefail
          expected="epic-games-launcher-$RPM_EVR.fc$FEDORA_VERSION.x86_64.rpm"
          actual=$(find release-assets -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "expected exactly $expected, got: $(tr '\n' ' ' <<< "$actual")" >&2
            echo "Epic probably changed its stable version during the run; the next run will retry" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum "$expected" > "$RUNNER_TEMP/SHA256SUMS"
          )
          mv "$RUNNER_TEMP/SHA256SUMS" release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          EPIC_FULL_VERSION: ${{ needs.plan.outputs.epic-full-version }}
          FEDORA_VERSION: ${{ needs.build-package.outputs.fedora-version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it" >&2
            exit 1
          fi

          rpm_file=$(find release-assets -maxdepth 1 -name '*.rpm' -printf '%f\n')
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Epic Games Launcher $EPIC_FULL_VERSION для Fedora $FEDORA_VERSION.

          Установка:

          \`\`\`
          sudo dnf install ./$rpm_file
          \`\`\`

          Уже установленные пакеты обновятся сами в течение часа после публикации.

          Неофициальная сборка: проект не связан с Epic Games.
          EOF

          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Epic Games Launcher $EPIC_FULL_VERSION ($RELEASE_TAG)" \
            --notes-file "$notes_file"

          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
