name: Arch package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    steps:
      - name: Install build and validation dependencies in the container
        run: >-
          pacman -Syu --noconfirm --needed git rust gtk3 gtk4 libadwaita
          webkit2gtk-4.1 libsoup3 libayatana-appindicator libnotify xdg-utils
          squashfs-tools patchelf desktop-file-utils namcap shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare, verify and build as an unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -s bash libexec/egl-proton-hook packaging/scripts/*.sh tests/*.sh tray/build.sh
          shellcheck -s sh libexec/egl-proton-router libexec/egl-launch
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- packaging/scripts/prepare-arch.sh
          cd build/arch
          runuser -u builder -- makepkg --verifysource
          runuser -u builder -- makepkg --printsrcinfo > actual.SRCINFO
          diff -u .SRCINFO actual.SRCINFO
          runuser -u builder -- makepkg --cleanbuild --force
          ../../packaging/scripts/check-namcap.sh PKGBUILD ./*.pkg.tar.zst
          ../../packaging/scripts/verify-package.sh ./*.pkg.tar.zst src/appdir
      - name: Check installed linkage inside the disposable container
        shell: bash
        run: |
          set -euo pipefail
          # The base container excludes documentation by default; validate the
          # complete package here, including its documentation directories.
          sed '/^NoExtract/d' /etc/pacman.conf > /tmp/egl-pacman.conf
          pacman --config /tmp/egl-pacman.conf -U --noconfirm build/arch/*.pkg.tar.zst
          pacman -Qkk epic-games-launcher-proton-bin
          ldd /opt/epic-games-launcher/bin/EpicGamesLauncher > /tmp/egl-linkage.txt
          cat /tmp/egl-linkage.txt
          ! grep -q 'not found' /tmp/egl-linkage.txt
          profile=$(mktemp -d)
          env HOME="$profile" XDG_CONFIG_HOME="$profile/config" XDG_STATE_HOME="$profile/state" egl-proton --list
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: epic-games-launcher-arch
          path: |
            build/arch/*.pkg.tar.zst
            build/arch/*.tar.xz
            build/arch/PKGBUILD
            build/arch/.SRCINFO
          if-no-files-found: error
